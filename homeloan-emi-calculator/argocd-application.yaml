apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: emi-calculator
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/sachin67224-ai/storagetax-gitops.git
    targetRevision: main
    path: apps/emi-calculator/k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: storagetax
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
